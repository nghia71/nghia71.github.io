<!-- MCC coding-lesson access gate.

The single point of entry is lessons.html: a student signs in there once
(id + PIN, checked server-side -- see assets/js/mcc-roster.js), which
remembers their id in this browser's localStorage. This gate, included at
the top of every lesson page, only ever checks that stored id -- it never
takes a link-based id or asks for a PIN itself, so there is exactly one way
in, not two competing ones. A lesson page opened directly without having
signed in at lessons.html first (or on a different device/browser) simply
points the visitor there. That same stored id is meant to be reused as the
student's identity for the Sunday coding-contest submissions later -- keep
the storage key and shape (id, name) if you build that next, rather than
inventing a second one.

To include on a lesson page:
  1. Put this file's include tag right before the page's real content.
  2. Wrap that real content in a div with id mcc-gate-content, starting
     hidden -- the gate reveals it on a match, and leaves it hidden
     (with an explanation in its place) otherwise.
  3. Add a noindex robots entry to the page's front matter so it doesn't
     turn up in search results.
  4. Optional: pass a requires_unlock parameter set to that lesson's own
     number (e.g. requires_unlock=2 for lesson-2.html) on the include tag
     for a lesson that's staged behind its own round's contest (see
     mcc-access-check.gs's TESTERS/LESSON_THRESHOLDS and its
     "unlockedLessons" response field -- an array of lesson numbers
     currently visible). Without this parameter a lesson behaves exactly
     as before -- any signed-in student sees it the moment their id/PIN
     check succeeds. With it, a signed-in student whose unlockedLessons
     array does NOT contain this lesson's number sees a "not open yet"
     message instead of the content, even though their sign-in itself is
     perfectly valid. Lesson 1 should never pass this parameter -- it's
     been open to everyone since before this existed. Do not pass `true`
     here -- a plain boolean can't tell one lesson's round from another's
     (see the 2026-09-20 fix in mcc-access-check.gs for why that matters).

Do not write this file's own include tag as literal example text
anywhere in this comment or in any other page's comment -- describe it
in prose instead, the way the lines above do. Jekyll's Liquid
template engine scans this whole file for template tags before HTML (or
HTML comments) mean anything to it, so literal example syntax in a
comment is not inert documentation to Jekyll, it is a real instruction --
and a real copy of this file's own include tag, written here, would make
this file include itself and break the whole site's build. This is not
a hypothetical: it happened on 2026-09-20 and took the whole site down
for about an hour before anyone noticed, because the failure is
completely silent -- GitHub Pages just keeps serving the last build that
worked, forever, with no error shown anywhere on the site itself.
-->
<div id="mcc-gate-screen" class="mcc-gate-screen">
  <p id="mcc-gate-message">Checking your access&hellip;</p>
</div>

<style>
  .mcc-gate-screen {
    max-width: 480px;
    margin: 2.5em auto;
    padding: 22px 26px;
    background: var(--white);
    border: 2px solid var(--brand);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .mcc-gate-screen p { margin: 0.4em 0; line-height: 1.5; }
  .mcc-gate-screen a { color: var(--brand); font-weight: 600; }
  #mcc-gate-welcome {
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 1em;
  }
</style>

<!-- ?v=N cache-busts this static asset -- keep this in sync with the
     same query string in lessons.html; bump both any time
     mcc-roster.js's content actually changes. -->
<script src="{{ '/assets/js/mcc-roster.js' | relative_url }}?v=3"></script>
<script>
(function () {
  var REQUIRES_UNLOCK = {{ include.requires_unlock | default: false }}; // false, or this lesson's own number
  var screen = document.getElementById("mcc-gate-screen");
  var message = document.getElementById("mcc-gate-message");
  // Deliberately NOT looked up here at parse time: this script tag runs
  // (per the include instructions above) right before the page's real
  // content, so #mcc-gate-content doesn't exist in the DOM yet at this
  // point -- getElementById would return null and content could never be
  // revealed. Looked up instead inside showGranted(), which only ever
  // runs from the checkAccess().then() callback below, by which time the
  // rest of the page has long since finished parsing (this script block
  // itself doesn't block parsing of what comes after it). This bit us on
  // 2026-09-20: access checks were succeeding but the lesson content
  // stayed hidden regardless.

  function showDenied() {
    message.innerHTML =
      "This lesson is for registered MCC coding-course students only.<br>" +
      "Sign in at <a href=\"{{ '/lessons.html' | relative_url }}\">the lessons page</a> with your student id and access code.";
  }

  // Shown for a student who IS signed in correctly, but this particular
  // lesson has requires_unlock and its own round's contest hasn't closed
  // yet (and this id isn't one of the early testers). Distinct from
  // showDenied -- the student did everything right, the lesson just
  // isn't open yet.
  function showLocked() {
    message.innerHTML =
      "This lesson opens once its contest window closes. Check back soon &mdash; " +
      "your sign-in is working correctly.";
  }

  function showGranted(name) {
    var content = document.getElementById("mcc-gate-content");
    screen.style.display = "none";
    if (content) content.style.display = "";
    // Skip this when shown inside the lessons hub's iframe -- the hub
    // already greets the student by name above the lesson table, so a
    // second "Welcome, X" here would just duplicate it.
    if (name && content && window.self === window.top && !document.getElementById("mcc-gate-welcome")) {
      var w = document.createElement("p");
      w.id = "mcc-gate-welcome";
      w.textContent = "Welcome, " + name + ".";
      content.insertBefore(w, content.firstChild);
    }
  }

  var stored = null;
  try { stored = JSON.parse(localStorage.getItem(MCCRoster.STORAGE_KEY) || "null"); } catch (e) {}

  if (stored && stored.id) {
    // No PIN needed again (this device already proved itself once at
    // lessons.html) -- just re-confirm the id is still on the roster.
    MCCRoster.checkAccess(stored.id)
      .then(function (result) {
        if (result && result.ok) {
          var lessonUnlocked = !REQUIRES_UNLOCK ||
            (result.unlockedLessons && result.unlockedLessons.indexOf(REQUIRES_UNLOCK) !== -1);
          if (!lessonUnlocked) {
            showLocked();
          } else {
            showGranted(result.name);
          }
        } else {
          // No longer on the roster -- never trust what's already in
          // localStorage over what the server says now.
          try { localStorage.removeItem(MCCRoster.STORAGE_KEY); } catch (e) {}
          showDenied();
        }
      })
      .catch(function () {
        message.textContent = "Couldn't check access right now — check your internet connection and reload the page.";
      });
  } else {
    showDenied();
  }
})();
</script>
