<!-- MCC coding-lesson access gate.

Checks a per-student link (this page's URL with ?student=<Student ID>
appended) against the club's roster -- published from Google Sheets as a
plain CSV, so editing the roster there takes effect immediately, no site
rebuild needed. A bare link is not enough by itself: the first time a
student's id is recognized on a device, the gate also asks for their PIN
(the roster's "PIN" column) before granting access -- so a link alone,
if it leaks on its own, doesn't work. Once the correct PIN is entered,
the student's id/name is remembered in this browser's localStorage (key
"mcc_student") so later visits to any lesson page work without the link
or the PIN again. That same stored id is meant to be reused as the
student's identity for the Sunday coding-contest submissions later --
keep the key name and shape (`{id, name}`) if you build that next, rather
than inventing a second one.

To include on a lesson page:
  1. Put the include tag for this file right before the page's real content.
     (Written as literal Liquid syntax elsewhere in this comment, wrapped in
     {% raw %}{% include lesson-gate.html %}{% endraw %} -- NEVER write that
     tag unescaped in a comment in this file: Jekyll's Liquid engine parses
     {% ... %} even inside HTML comments, so an unescaped copy of this
     file's own include tag here would make it include itself and break
     the whole site's build.)
  2. Wrap that real content in <div id="mcc-gate-content" style="display:none">
     ... </div> -- the gate reveals it on a match, and leaves it hidden
     (with an explanation in its place) otherwise.
  3. Add `robots: noindex` to the page's front matter so it doesn't turn up
     in search results.

The student-facing link (roster's "Lesson Link" column) points at
access.html, NOT at a specific lesson -- that's the one link + one PIN a
student ever needs, since verifying there sets the same localStorage this
include checks everywhere. Every lesson page still needs its own copy of
the include tag above (a direct URL to a lesson, with no prior access.html
visit on that device, must still be gated), but doesn't need its own
per-student link.
-->
<div id="mcc-gate-screen" class="mcc-gate-screen">
  <p id="mcc-gate-message">Checking your access&hellip;</p>
  <form id="mcc-gate-pin-form" style="display:none">
    <p id="mcc-gate-pin-welcome"></p>
    <label for="mcc-gate-pin-input">Paste your access code</label><br>
    <input type="text" id="mcc-gate-pin-input" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
    <button type="submit">Continue</button>
    <p id="mcc-gate-pin-error" style="display:none;">That code doesn't match &mdash; try pasting it again.</p>
  </form>
</div>

<style>
  .mcc-gate-screen {
    max-width: 480px;
    margin: 2.5em auto;
    padding: 22px 26px;
    background: var(--white);
    border: 2px solid var(--brand);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .mcc-gate-screen p { margin: 0.4em 0; line-height: 1.5; }
  #mcc-gate-welcome {
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 1em;
  }
  #mcc-gate-pin-welcome { font-weight: 600; }
  #mcc-gate-pin-input {
    font-size: 1em;
    font-family: monospace;
    padding: 6px 10px;
    margin: 0.5em 0.5em 0.5em 0;
    border: 1px solid var(--ink-soft);
    border-radius: 6px;
    width: 16em;
    max-width: 90%;
    text-align: center;
  }
  #mcc-gate-pin-form button {
    font-size: 1em;
    padding: 6px 16px;
    border-radius: 6px;
    border: none;
    background: var(--brand);
    color: var(--white);
    cursor: pointer;
  }
  #mcc-gate-pin-error { color: #b3261e; }
</style>

<script>
(function () {
  // Published-to-web CSV of the coding-course roster (Student Name,
  // Student ID, Student Email Address, PIN). Publicly fetchable by design --
  // that's what lets a student's own browser check it with no server. The
  // sheet itself is NOT public (shared with coordinators only); this
  // published CSV is a separate, narrower export of the same tab.
  var ROSTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQxkm8DlgUpQhYr7wmkA3lx-t3bhPsUSMq9xnQnKPfyBKINs4_egnNFa25t2eUK3Vkmvw6ZQleNu5HY/pub?gid=1600479189&single=true&output=csv";
  var STORAGE_KEY = "mcc_student";

  var screen = document.getElementById("mcc-gate-screen");
  var message = document.getElementById("mcc-gate-message");
  var content = document.getElementById("mcc-gate-content");
  var pinForm = document.getElementById("mcc-gate-pin-form");
  var pinWelcome = document.getElementById("mcc-gate-pin-welcome");
  var pinInput = document.getElementById("mcc-gate-pin-input");
  var pinError = document.getElementById("mcc-gate-pin-error");

  function showDenied() {
    pinForm.style.display = "none";
    message.style.display = "";
    message.innerHTML =
      "This lesson is for registered MCC coding-course students only.<br>" +
      "Use the personal link from your registration confirmation, or ask your coordinator for it.";
  }

  function showGranted(student) {
    screen.style.display = "none";
    if (content) content.style.display = "";
    if (student.name && content && !document.getElementById("mcc-gate-welcome")) {
      var w = document.createElement("p");
      w.id = "mcc-gate-welcome";
      w.textContent = "Welcome, " + student.name + ".";
      content.insertBefore(w, content.firstChild);
    }
  }

  function rememberAndGrant(student) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(student)); } catch (e) { /* private browsing -- fine, just won't persist */ }
    showGranted(student);
  }

  function askForPin(student) {
    message.style.display = "none";
    pinWelcome.textContent = student.name ? "Hi " + student.name + " — one more step." : "One more step.";
    pinError.style.display = "none";
    pinForm.style.display = "";
    pinInput.value = "";
    pinInput.focus();

    pinForm.onsubmit = function (e) {
      e.preventDefault();
      var entered = pinInput.value.trim();
      if (entered && student.pin && entered === student.pin) {
        rememberAndGrant(student);
      } else {
        pinError.style.display = "";
        pinInput.value = "";
        pinInput.focus();
      }
    };
  }

  // Minimal CSV parser -- handles quoted fields (with embedded commas or
  // escaped quotes), which is all a Google Sheets export ever produces.
  // No need for a library over four plain columns.
  function parseCsv(text) {
    var rows = [], row = [], field = "", inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; }
        } else {
          field += c;
        }
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        row.push(field); field = "";
      } else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else {
        field += c;
      }
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function findStudent(rows, studentId) {
    if (!rows.length) return null;
    var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var idCol = header.indexOf("student id");
    var nameCol = header.indexOf("student name");
    var pinCol = header.indexOf("pin");
    if (idCol === -1) return null;
    var target = studentId.trim().toLowerCase();
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      if (row[idCol] && row[idCol].trim().toLowerCase() === target) {
        return {
          id: row[idCol].trim(),
          name: nameCol > -1 ? (row[nameCol] || "").trim() : "",
          pin: pinCol > -1 ? (row[pinCol] || "").trim() : ""
        };
      }
    }
    return null;
  }

  // fromLink: true when we got here via ?student=... (a fresh link, PIN
  // required); false when re-checking an id already remembered on this
  // device (no PIN needed again -- the device already proved it once).
  function checkAccess(studentId, fromLink) {
    fetch(ROSTER_CSV_URL)
      .then(function (r) {
        if (!r.ok) throw new Error("roster fetch failed: " + r.status);
        return r.text();
      })
      .then(function (text) {
        var student = findStudent(parseCsv(text), studentId);
        if (!student) {
          // A stored id that no longer matches (removed from the roster, or
          // a stale/bad link) never grants access -- always clear it rather
          // than trusting what's already in localStorage.
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          showDenied();
          return;
        }
        if (!fromLink) {
          // Already verified on this device earlier; just re-confirm they're
          // still on the roster.
          showGranted(student);
          return;
        }
        if (!student.pin) {
          message.style.display = "";
          message.textContent = "Your access PIN hasn't been set up yet — ask your coordinator for it.";
          return;
        }
        askForPin(student);
      })
      .catch(function () {
        message.style.display = "";
        message.textContent = "Couldn't check access right now — check your internet connection and reload the page.";
      });
  }

  var params = new URLSearchParams(window.location.search);
  var linkId = params.get("student");

  if (linkId) {
    checkAccess(linkId, true);
  } else {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) {}
    if (stored && stored.id) {
      checkAccess(stored.id, false);
    } else {
      showDenied();
    }
  }
})();
</script>
