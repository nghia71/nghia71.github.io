<!-- MCC coding-lesson access gate.

Checks a per-student link (this page's URL with a student query parameter
appended) against the club's roster, via the shared helpers in
assets/js/mcc-roster.js. A bare link is not enough by itself: the first
time a student's id is recognized on a device, the gate also asks for
their PIN (the roster's PIN column) before granting access -- so a link
alone, if it leaks on its own, doesn't work. Once the correct PIN is
entered, the student's id/name is remembered in this browser's
localStorage so later visits to any lesson page -- or the lessons hub --
work without the link or the PIN again. That same stored id is meant to
be reused as the student's identity for the Sunday coding-contest
submissions later -- keep the storage key and shape (id, name) if you
build that next, rather than inventing a second one.

To include on a lesson page:
  1. Put this file's include tag right before the page's real content.
  2. Wrap that real content in a div with id mcc-gate-content, starting
     hidden -- the gate reveals it on a match, and leaves it hidden
     (with an explanation in its place) otherwise.
  3. Add a noindex robots entry to the page's front matter so it doesn't
     turn up in search results.

Do not write this file's own include tag as literal example text
anywhere in this comment or in any other page's comment -- describe it
in prose instead, the way the three lines above do. Jekyll's Liquid
template engine scans this whole file for template tags before HTML (or
HTML comments) mean anything to it, so literal example syntax in a
comment is not inert documentation to Jekyll, it is a real instruction --
and a real copy of this file's own include tag, written here, would make
this file include itself and break the whole site's build. This is not
a hypothetical: it happened on 2026-09-20 and took the whole site down
for about an hour before anyone noticed, because the failure is
completely silent -- GitHub Pages just keeps serving the last build that
worked, forever, with no error shown anywhere on the site itself.

The roster's "Lesson Link" column points students at lesson-1.html --
that one link is all a student ever needs, even as more lessons are
added: verifying there sets localStorage, and every later lesson page
(each with its own copy of the include tag above) recognizes the same
device automatically, no new link or PIN required. Students can also
skip links entirely via lessons.html, which asks for the student id and
PIN directly (typed in, not from a URL) and sets the same localStorage.
-->
<div id="mcc-gate-screen" class="mcc-gate-screen">
  <p id="mcc-gate-message">Checking your access&hellip;</p>
  <form id="mcc-gate-pin-form" style="display:none">
    <p id="mcc-gate-pin-welcome"></p>
    <label for="mcc-gate-pin-input">Paste your access code</label><br>
    <input type="text" id="mcc-gate-pin-input" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="40">
    <button type="submit">Continue</button>
    <p id="mcc-gate-pin-error" style="display:none;">That code doesn't match &mdash; try pasting it again.</p>
  </form>
</div>

<style>
  .mcc-gate-screen {
    max-width: 480px;
    margin: 2.5em auto;
    padding: 22px 26px;
    background: var(--white);
    border: 2px solid var(--brand);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .mcc-gate-screen p { margin: 0.4em 0; line-height: 1.5; }
  #mcc-gate-welcome {
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 1em;
  }
  #mcc-gate-pin-welcome { font-weight: 600; }
  #mcc-gate-pin-input {
    font-size: 1em;
    font-family: monospace;
    padding: 6px 10px;
    margin: 0.5em 0.5em 0.5em 0;
    border: 1px solid var(--ink-soft);
    border-radius: 6px;
    width: 16em;
    max-width: 90%;
    text-align: center;
  }
  #mcc-gate-pin-form button {
    font-size: 1em;
    padding: 6px 16px;
    border-radius: 6px;
    border: none;
    background: var(--brand);
    color: var(--white);
    cursor: pointer;
  }
  #mcc-gate-pin-error { color: #b3261e; }
</style>

<script src="{{ '/assets/js/mcc-roster.js' | relative_url }}"></script>
<script>
(function () {
  var screen = document.getElementById("mcc-gate-screen");
  var message = document.getElementById("mcc-gate-message");
  var content = document.getElementById("mcc-gate-content");
  var pinForm = document.getElementById("mcc-gate-pin-form");
  var pinWelcome = document.getElementById("mcc-gate-pin-welcome");
  var pinInput = document.getElementById("mcc-gate-pin-input");
  var pinError = document.getElementById("mcc-gate-pin-error");

  function showDenied() {
    pinForm.style.display = "none";
    message.style.display = "";
    message.innerHTML =
      "This lesson is for registered MCC coding-course students only.<br>" +
      "Use the personal link from your registration confirmation, or ask your coordinator for it.";
  }

  function showGranted(student) {
    screen.style.display = "none";
    if (content) content.style.display = "";
    if (student.name && content && !document.getElementById("mcc-gate-welcome")) {
      var w = document.createElement("p");
      w.id = "mcc-gate-welcome";
      w.textContent = "Welcome, " + student.name + ".";
      content.insertBefore(w, content.firstChild);
    }
  }

  function rememberAndGrant(student) {
    try { localStorage.setItem(MCCRoster.STORAGE_KEY, JSON.stringify(student)); } catch (e) { /* private browsing -- fine, just won't persist */ }
    showGranted(student);
  }

  function askForPin(student) {
    message.style.display = "none";
    pinWelcome.textContent = student.name ? "Hi " + student.name + " — one more step." : "One more step.";
    pinError.style.display = "none";
    pinForm.style.display = "";
    pinInput.value = "";
    pinInput.focus();

    pinForm.onsubmit = function (e) {
      e.preventDefault();
      var entered = pinInput.value.trim();
      if (entered && student.pin && entered === student.pin) {
        rememberAndGrant(student);
      } else {
        pinError.style.display = "";
        pinInput.value = "";
        pinInput.focus();
      }
    };
  }

  // fromLink: true when we got here via a student query parameter (a
  // fresh link, PIN required); false when re-checking an id already
  // remembered on this device (no PIN needed again -- the device already
  // proved it once).
  function checkAccess(studentId, fromLink) {
    fetch(MCCRoster.ROSTER_CSV_URL)
      .then(function (r) {
        if (!r.ok) throw new Error("roster fetch failed: " + r.status);
        return r.text();
      })
      .then(function (text) {
        var student = MCCRoster.findStudent(MCCRoster.parseCsv(text), studentId);
        if (!student) {
          // A stored id that no longer matches (removed from the roster, or
          // a stale/bad link) never grants access -- always clear it rather
          // than trusting what's already in localStorage.
          try { localStorage.removeItem(MCCRoster.STORAGE_KEY); } catch (e) {}
          showDenied();
          return;
        }
        if (!fromLink) {
          // Already verified on this device earlier; just re-confirm they're
          // still on the roster.
          showGranted(student);
          return;
        }
        if (!student.pin) {
          message.style.display = "";
          message.textContent = "Your access PIN hasn't been set up yet — ask your coordinator for it.";
          return;
        }
        askForPin(student);
      })
      .catch(function () {
        message.style.display = "";
        message.textContent = "Couldn't check access right now — check your internet connection and reload the page.";
      });
  }

  var params = new URLSearchParams(window.location.search);
  var linkId = params.get("student");

  if (linkId) {
    checkAccess(linkId, true);
  } else {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem(MCCRoster.STORAGE_KEY) || "null"); } catch (e) {}
    if (stored && stored.id) {
      checkAccess(stored.id, false);
    } else {
      showDenied();
    }
  }
})();
</script>
