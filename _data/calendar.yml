# Club-wide dates: the single source for the Calendar page (calendar.md)
# and the add-to-calendar file (assets/mcc-calendar.ics).
#
# To add a date, copy an entry and edit it. Keep the list in date order.
#   until:    last day the row shows on the page (YYYY-MM-DD). The page hides
#             a row by itself once that day has passed (US Pacific time), so
#             past dates disappear without anyone editing the page.
#   when_en / when_vn, what_en / what_vn, time_en / time_vn: the table cells
#             (Markdown links allowed). Leave a time empty for all-day items.
#   ics:      optional; puts the event in the .ics file.
#             Timed:   start/end in UTC, e.g. "20261115T160000Z"
#                      (8:00 AM PST = 16:00 UTC; 7:00 AM PST = 15:00 UTC).
#             All day: start/end as dates, end = the day AFTER the last day.
#   id:       a short unique name (used as the event's ID in calendars).
#
# Club times are US Pacific time (PST in winter); B.C. stays on UTC-7, so
# Victoria is one hour ahead of PST until 14 March 2027.

