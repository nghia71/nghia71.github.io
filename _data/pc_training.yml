# Purple Comet training (semester 2, 2026-27): the six mocks.
# Single source for /purple-comet-training and /purple-comet-training/mocks.
# Plan: project doc claude/semester2-purple-comet-training-plan-2026-11-25.md
#
# Per mock, fill in as it happens (leave a field empty until then):
#   year:        the Purple Comet year used (e.g. 2021); shown only after the mock
#   start_ms/start_hs, submit_ms/submit_hs: the links for the day (Start opens
#                the paper; Submit is the answer form). Put them in shortly before
#                the window and remove them after it closes.
#   paper_ms/paper_hs, key_ms/key_hs: paper and answer-key links, AFTER the window
#   solutions:   link to the solutions page, once written
#   until:       last day the "next mock" box on the main page shows this mock
#
# Times: 8:00 AM US Pacific time. MS ends 9:00, HS ends 9:30.
# PST until 13 March 2027 (8:00 AM = 16:00 UTC); PDT from 14 March (8:00 AM = 15:00 UTC).

