title: Math Club & Competitions
tagline: A global math club
description: >-
  Math Club & Competitions (MCC) is a global mathematics club founded in Canada
  by Nghia Doan. We train students from Grade 4 to Grade 12 in problem solving,
  olympiad mathematics, and team competition.
lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Navigation shown in the header of every page.
nav:
  - title: Home
    url: /
  - title: Programs
    url: /programs
  - title: Organization
    url: /organization
  - title: Books
    url: /books
  - title: Tests & Yearbook
    url: /tests
  - title: Current Standings
    url: /current-standings
  - title: TOML
    url: /toml.html
  - title: Purple Comet
    url: /purple-comet-2026
  - title: Archive
    url: /archive

# Whether the UAT / Testing-the-pipeline test-suite links show up at the
# bottom of Current Standings. Flip to false (and push) to hide them again
# without deleting or rewriting any of the underlying pages -- they stay on
# disk and reachable by direct link either way, this only controls whether
# Current Standings links out to them. Added 2026-09-15 for the UAT re-test
# week; see current-standings.md's "Test suites" section, wrapped in
# {% if site.show_test_material %}.
show_test_material: true

exclude:
  - .DS_Store
  - vendor
  - Gemfile
  - Gemfile.lock
