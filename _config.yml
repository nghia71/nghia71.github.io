title: Math Club & Competitions
tagline: Online math club and olympiad training, Grades 4–12
description: >-
  Math Club & Competitions (MCC) is a non-profit online math club founded in
  Canada by Nghia Doan. Students in Grades 4 to 12 train in problem solving and
  math olympiad competition, work in teams, and compete at Purple Comet.
  Câu lạc bộ toán trực tuyến cho học sinh lớp 4–12.
lang: en

url: https://nghia71.github.io

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Navigation shown in the header of every page.
nav:
  - title: Home
    url: /
  - title: Programs
    url: /programs
  - title: Calendar
    url: /calendar
  - title: Organization
    url: /organization
  - title: Books
    url: /books
  - title: Video Lectures
    url: /video-lectures
  - title: Tests
    url: /tests
  - title: Current Standings
    url: /current-standings
  - title: TOML
    url: /toml.html
  - title: Purple Comet
    url: /purple-comet-2026
  - title: Archive
    url: /archive

# Whether the UAT / Testing-the-pipeline test-suite links show up at the
# bottom of Current Standings. Flip to false (and push) to hide them again
# without deleting or rewriting any of the underlying pages -- they stay on
# disk and reachable by direct link either way, this only controls whether
# Current Standings links out to them. Added 2026-09-15 for the UAT re-test
# week; see current-standings.md's "Test suites" section, wrapped in
# {% if site.show_test_material %}.
show_test_material: true

exclude:
  - .DS_Store
  - vendor
  - Gemfile
  - Gemfile.lock
