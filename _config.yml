title: Math Club & Competitions
tagline: A global math club
description: >-
  Math Club & Competitions (MCC) is a global mathematics club founded in Canada
  by Nghia Doan. We train students from Grade 4 to Grade 12 in problem solving,
  olympiad mathematics, and team competition.
lang: en

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Navigation shown in the header of every page.
nav:
  - title: Home
    url: /
  - title: Register
    url: /register
  - title: Programs
    url: /programs
  - title: Books
    url: /books
  - title: Uncounted Worlds
    url: /uncounted-worlds
  - title: Tests & Yearbook
    url: /tests
  - title: Purple Comet
    url: /purple-comet-2026
  - title: TOML
    url: /toml.html
  - title: Archive
    url: /archive

exclude:
  - .DS_Store
  - vendor
  - Gemfile
  - Gemfile.lock
